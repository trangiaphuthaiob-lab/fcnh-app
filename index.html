<script>/* Google Apps Script bridge: gives the app the same db/user/downloads API it uses on Claude, backed by a Google Sheet. */
(function(){
window.__GAS=true;window.__gasRun=(...a)=>run(...a);
const mem={};const ls={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const API="https://script.google.com/macros/s/AKfycbzYDcowQm-dQi8qDBuIyBeimEavFcEJJ_uy5d3tLWuOrc_IIZ4r3teO9TrS4ZD42Iur/exec";
const run=async(fn,...a)=>{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:a})});const j=await r.json();if(j&&j.error)throw new Error(j.error);return j.r};
const clone=x=>x===undefined?undefined:JSON.parse(JSON.stringify(x));
let tok=ls.get("fcnh_tok")||"";let store={},ver=null,pin=ls.get("fcnh_pin")||"",admin=false,subs=[];
const notify=()=>subs.slice().forEach(f=>{try{f()}catch(e){}});
const parts=p=>p.split("/");const colOf=p=>parts(p).slice(0,-1).join("/");
const isLocal=p=>p.indexOf("data/users/")===0;
async function pull(){const r=await run("snap",pin);store=r.docs||{};window.__codes=r.codes||{};ver=r.ver;admin=!!r.admin;notify();return r}
function snapDoc(path){const d=store[path];return {id:parts(path).pop(),exists:d!==undefined,data:()=>clone(d)}}
async function write(op,path,data){
  const r=await run("wr",pin,op,path,data===undefined?null:data,tok);
  if(r&&r.error){await pull().catch(()=>{});const e=new Error(r.error);e.code=r.error;throw e}
}
function docRef(path){return {id:parts(path).pop(),path,
 get:async()=>{if(isLocal(path)){const v=ls.get("fcnh_l::"+path);return {id:parts(path).pop(),exists:v!=null,data:()=>v?JSON.parse(v):undefined}}return snapDoc(path)},
 set:async d=>{if(isLocal(path)){ls.set("fcnh_l::"+path,JSON.stringify(d));return}store[path]=clone(d);notify();await write("set",path,d)},
 update:async d=>{if(isLocal(path)){return}if(store[path]===undefined){const e=new Error("invalid_argument");e.code="invalid_argument";throw e}
   const n=Object.assign({},store[path]);for(const k of Object.keys(d)){if(d[k]&&typeof d[k]==="object"&&d[k].__delete__)delete n[k];else n[k]=clone(d[k])}store[path]=n;notify();await write("update",path,d)},
 delete:async()=>{if(isLocal(path)){ls.del("fcnh_l::"+path);return}delete store[path];notify();await write("delete",path)},
 onSnapshot:(cb)=>{const f=()=>cb(snapDoc(path));subs.push(f);setTimeout(f,0);return()=>{subs=subs.filter(x=>x!==f)}}}}
function colRef(path){return {doc:id=>docRef(path+"/"+id),
 onSnapshot:(cb)=>{const f=()=>{const docs=Object.keys(store).filter(k=>colOf(k)===path).map(snapDoc);cb({docs,size:docs.length})};subs.push(f);setTimeout(f,0);return()=>{subs=subs.filter(x=>x!==f)}}}}
let uid=ls.get("fcnh_uid");if(!uid){uid="d"+Math.random().toString(36).slice(2)+Date.now().toString(36);ls.set("fcnh_uid",uid)}
const user={id:async()=>uid,canEdit:async()=>admin,isOwner:async()=>admin,can:async()=>true,me:async()=>({}),
 login:async p=>{const ok=await run("checkPin",p);if(!ok)return false;pin=p;ls.set("fcnh_pin",p);await pull();return true},
 logout:async()=>{pin="";ls.del("fcnh_pin");admin=false;await pull()}};
const downloads={save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500)}};
let db=null;
async function ensure(){if(db)return db;await pull();db={doc:docRef,collection:colRef};
  const tick=async()=>{if(document.hidden)return;try{const v=await run("ver");if(v!==ver)await pull()}catch(e){}};
  setInterval(tick,5000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});return db}
window.__memLogin=async(id,code)=>{const r=await run("memLogin",id,String(code).trim());if(r&&r.ok){tok=id+":"+String(code).trim();ls.set("fcnh_tok",tok);return {ok:true}}return r||{ok:false}};
window.__memOut=()=>{tok="";ls.del("fcnh_tok")};
window.__tokId=()=>tok.split(":")[0];
window.__memCheck=async()=>{if(!tok)return false;const i=tok.indexOf(":");try{const r=await run("memLogin",tok.slice(0,i),tok.slice(i+1));return !!(r&&r.ok)}catch(e){return true}};
window.claude={use:async n=>{
  if(n==="db"){try{return await ensure()}catch(e){return null}}
  if(n==="user")return user;
  if(n==="downloads")return downloads;
  return null}};
})();

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font:400 14px/1.5 var(--sans);position:relative;
  background-image:var(--noise),radial-gradient(ellipse 70% 40% at 0% 0%,rgba(0,217,255,.20),transparent 62%),radial-gradient(ellipse 60% 50% at 100% 40%,rgba(74,158,255,.14),transparent 65%),radial-gradient(ellipse 80% 40% at 40% 108%,rgba(127,219,255,.12),transparent 62%),linear-gradient(180deg,#0A1030,#070B20);background-attachment:fixed}
body::before{content:"";position:fixed;right:-14vmin;bottom:-8vmin;width:70vmin;height:76vmin;background:var(--logo) center/contain no-repeat;opacity:.05;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;min-width:0}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--cond);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.cond{font-family:var(--cond);font-weight:700;letter-spacing:.01em}

/* shell */
.side{position:fixed;left:0;top:0;bottom:0;width:250px;padding:14px 12px 16px;display:none;flex-direction:column;gap:6px;background:rgba(7,11,32,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line);overflow-y:auto;z-index:30}
.brandrow{display:flex;align-items:center;gap:10px;padding:2px 4px 10px;font-weight:800;font-size:17px}
.mark{width:40px;height:40px;flex:none;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 0 8px rgba(0,217,255,.35))}
.me-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:16px;background:linear-gradient(135deg,#0A8FB0,#0A6A8C);color:#fff;margin-bottom:10px}
.me-card .t{font-weight:700;line-height:1.2}.me-card .s{font-size:12px;opacity:.85;line-height:1.3}
.me-av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.grp{font-size:11px;font-weight:700;color:var(--muted);padding:12px 8px 4px}
.ni{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:14px;color:var(--muted);font-weight:600;font-size:15px;text-align:left}
.ni svg{width:20px;height:20px;flex:none}
.ni:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.ni.on{background:rgba(0,217,255,.14);color:var(--accent)}
.side .foot{margin-top:auto;padding:12px 8px 0;font-size:12px;color:var(--muted);line-height:1.5}

function paint(){
  const keep={};let focusId=null,selS=null,selE=null,sy=null,wy=window.scrollY;
  $app.querySelectorAll("input:not([type=file]),select,textarea").forEach(el=>{if(!el.id)return;keep[el.id]=el.type==="checkbox"?el.checked:el.value});
  const ae=document.activeElement;if(ae&&ae.id&&$app.contains(ae)){focusId=ae.id;try{selS=ae.selectionStart;selE=ae.selectionEnd}catch(e){}}
  const sh=$app.querySelector(".sheet");sy=sh?sh.scrollTop:null;
  $app.innerHTML=S.loaded?view():'<div style="display:flex;justify-content:center;padding-top:24vh;color:#A8B2D8;font-size:12px;letter-spacing:.14em">ĐANG TẢI…</div>';
  $app.querySelectorAll("input:not([type=file]),select,textarea").forEach(el=>{if(el.id&&keep[el.id]!==undefined){if(el.type==="checkbox")el.checked=keep[el.id];else if(el.tagName==="SELECT"){if([...el.options].some(o=>o.value===keep[el.id]))el.value=keep[el.id]}else el.value=keep[el.id]}});
  const sh2=$app.querySelector(".sheet");if(sh2&&sy!=null)sh2.scrollTop=sy;
  if(wy&&Math.abs(window.scrollY-wy)>2)window.scrollTo(0,wy);
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus({preventScroll:true});try{if(selS!=null)el.setSelectionRange(selS,selE)}catch(e){}}}
  tickCd();
}

function stats(per){
  const st={};const ensure=id=>st[id]||(st[id]={pred:0,predN:0,exact:0,play:0,w:0,d:0,l:0,gd:0,pts:0,fund:0,went:0,bung:0,sponsor:0,goals:0,assists:0,mvp:0,hat:0,gp:0,ot:0,cs:0,pen:0,yc:0,rc:0,pay:0,sup:0,t2:0,t3:0});
  const fin=finishedMatches().filter(m=>inPeriod(m.kickoff,per));
  for(const m of fin){
    {const ps0=S.pstats[m.id];if(ps0&&ps0.pl){for(const id of ps0.pl)ensure(id).play++}else for(const m2 of activeMembers()){const v=voteOf(m.id,m2.id);if(v&&v.s==="play")ensure(m2.id).play++}}
    for(const [k,p] of Object.entries(S.pred)){if(!k.startsWith(m.id+"__"))continue;const id=k.split("__")[1],pt=predPoints(m,p);if(pt==null)continue;const s=ensure(id);s.pred+=pt;s.predN++;if(pt===C().ptsExact)s.exact++}
    const ps=S.pstats[m.id];if(ps){{const c9=C();for(const [id,n] of Object.entries(ps.g||{})){const k=Number(n)||0;ensure(id).goals+=k;ensure(id).gp+=k*(goalPt(c9,posIn(ps,id))||0);if(k>=3)ensure(id).hat++}}for(const id of (ps.pay||[]))ensure(id).pay++;for(const id of (ps.sup||[]))ensure(id).sup++;for(const [id,n] of Object.entries(ps.a||{}))ensure(id).assists+=Number(n)||0;for(const id of (ps.ot||[]))ensure(id).ot++;for(const id of (ps.cs||[]))ensure(id).cs++;for(const id of (ps.pp||[]))ensure(id).pen++;for(const [id,n] of Object.entries(ps.yc||{}))ensure(id).yc+=Number(n)||0;for(const [id,n] of Object.entries(ps.rc||{}))ensure(id).rc+=Number(n)||0;if(ps.mvp)ensure(ps.mvp).mvp++}
    const t=S.teams[m.id];if(t&&m.sb!=null){for(const [side,gf,ga] of [["blue",m.sb,m.so],["orange",m.so,m.sb]])for(const id of t[side].slice(0,m.teamSize||C().teamSize)){const s=ensure(id);s.gd+=gf-ga;if(gf>ga){s.w++;s.pts+=3}else if(gf===ga){s.d++;s.pts++}else s.l++}}
    for(const n of [2,3]){const key=m.id+"_"+n,r=S.rounds[key];if(!r)continue;const vs=Object.entries(S.rvotes).filter(([k])=>k.startsWith(key+"__"));
      for(const [k,v] of vs){const id=k.split("__")[1];if(v.s==="join"){if(r.shares){if(r.shares[id]!=null){ensure(id).went++;if(n===2)ensure(id).t2++;else ensure(id).t3++}else ensure(id).bung++}}}
      if(r.payer&&r.shares)ensure(r.payer).sponsor++}
  }
  for(const t of fundList()){if(t.type==="in"&&t.mid&&!t.rev&&inPeriod(t.date,per)&&!t.revOf)ensure(t.mid).fund+=t.amount}
  return st;
}

function fundFlags(list){

}

/* ---------- team split & analysis ---------- */
function doSplit(mid){
  const m=S.matches[mid],size=m.teamSize||C().teamSize,g=voteGroups(mid).play;
  const rate=id=>(S.ratings[id]&&Number(S.ratings[id].v))||5;
  const jit=()=>(Math.random()-.5)*.7;
  let pool=g.map(id=>({id,r:rate(id)+jit(),gk:posOf(id).includes("TM")}));
  pool.sort((a,b)=>b.r-a.r);
  const B=[],O=[];let sb=0,so=0;
  const gks=pool.filter(p=>p.gk);if(gks.length>=2){B.push(gks[0]);sb+=gks[0].r;O.push(gks[1]);so+=gks[1].r;pool=pool.filter(p=>p!==gks[0]&&p!==gks[1])}
  for(const p of pool){const toB=sb<so||(sb===so&&B.length<=O.length);if(B.length>=Math.ceil(g.length/2)&&!toB&&O.length<Math.floor(g.length/2)){O.push(p);so+=p.r}else if(O.length>=Math.ceil(g.length/2)&&toB){O.push(p);so+=p.r}else if(toB&&B.length<Math.ceil(g.length/2)){B.push(p);sb+=p.r}else{O.push(p);so+=p.r}}
  const ord=a=>a.sort((x,y)=>y.r-x.r).map(p=>p.id);
  return {blue:ord(B),orange:ord(O),sumB:B.reduce((s,p)=>s+rate(p.id),0)/Math.max(1,B.length),sumO:O.reduce((s,p)=>s+rate(p.id),0)/Math.max(1,O.length)};
}
function probs(t){const rate=id=>(S.ratings[id]&&Number(S.ratings[id].v))||5;const avg=a=>a.reduce((s,id)=>s+rate(id),0)/Math.max(1,a.length);const d=avg(t.blue)-avg(t.orange);const draw=Math.max(12,Math.round(26-Math.min(14,Math.abs(d)*6)));const s=1/(1+Math.exp(-.8*d));const b=Math.round((100-draw)*s);return {pb:b,pd:draw,po:100-draw-b}}

async function uploadMedia(el){
  const files=[...el.files];el.value="";if(!files.length)return;
  const run=window.__gasRun;let ok=0;
  for(let i=0;i<files.length;i++){
    const f=files[i],tag=files.length>1?" ("+(i+1)+"/"+files.length+")":"";
    const isV=/^video\//.test(f.type),isI=/^image\//.test(f.type);
    if(!isV&&!isI){toast("Chỉ nhận ảnh hoặc video");continue}
    if(isV&&f.size>150*1048576){toast("Video quá lớn (tối đa 150MB)");continue}
    try{
      let blob=f,name=f.name||"file";
      if(isI&&f.size>1.2*1048576){try{blob=await shrink(f);name=name.replace(/\.[^.]+$/,"")+".jpg"}catch(x){blob=f}}
      const mime=blob.type||f.type||"application/octet-stream",total=blob.size,CH=3*1048576;
      toast("Đang tải lên"+tag+" 0%");
      const url=await run("upInit",(S.meId?nm(S.meId)+"_":"")+Date.now().toString(36)+"_"+name,mime,total);
      let id=null;
      for(let s=0;s<total;s+=CH){
        const part=blob.slice(s,Math.min(total,s+CH));
        const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(part)});
        const r=await run("upChunk",url,b64,s,total);
        if(r&&r.id)id=r.id;
        toast("Đang tải lên"+tag+" "+Math.min(99,Math.round((s+part.size)*100/total))+"%");
      }
      if(!id)throw new Error("noid");
      await run("upDone",id);
      const mid="p"+Date.now().toString(36)+uid8();
      if(await save("media/"+mid,{m:S.mediaMatch||"",fid:id,kind:isV?"video":"image",name,who:S.meId||null,url:"https://drive.google.com/thumbnail?id="+id+"&sz=w600",link:"https://drive.google.com/file/d/"+id+"/view",t:new Date().toISOString()}))ok++;
    }catch(x){toast("Tải lên thất bại, thử lại nhé")}
  }
  if(ok)toast("Đã thêm "+ok+" tệp vào Kỷ niệm");
}
function shrink(f){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const M=2000,k=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),"image/jpeg",.85)};img.onerror=()=>{URL.revokeObjectURL(u);rej()};img.src=u})}

  case "createMatch":{const venue=val("nmV").trim(),k=fromLocal(val("nmK"));if(!venue||!k)return toast("Nhập sân và giờ bóng lăn");

    const id="m"+Date.now().toString(36);if(await save("matches/"+id,{venue,kickoff:k,deadline:dl,status:"open",teamSize:C().teamSize,created:new Date().toISOString()})){S.modal=null;S.page="week";S.selMatch=null;toast("Đã tạo trận")}break}

  case "split":{const r=doSplit(mid),old=S.teams[mid];const hist=((old&&old.hist)||[]).concat(old?[{n:old.n||1,blue:old.blue,orange:old.orange}]:[]).slice(-12);const ok=await save("teams/"+mid,{blue:r.blue,orange:r.orange,n:((old&&old.n)||0)+1,hist,t:new Date().toISOString()});if(ok){S.hv=null;toast("Đã chia đội lần "+(((old&&old.n)||0)+1))}break}
  case "swap":{const t=S.teams[mid];if(!t)return;const from=el.dataset.c,to=from==="blue"?"orange":"blue";const nt={blue:t.blue.slice(),orange:t.orange.slice(),n:t.n||1,hist:t.hist||[],t:t.t};nt[from]=nt[from].filter(x=>x!==v);nt[to].push(v);await save("teams/"+mid,nt);break}
  case "analyze":{const t=S.teams[mid];if(!t||!S.sample)return;const p=probs(t);toast("Đang viết nhận định…");
    const recent=finishedMatches().slice(0,5).map(f=>`${fmtD(f.kickoff)}: Xanh ${f.sb}-${f.so} Cam`).join("; ")||"chưa có trận trước";
    const desc=side=>t[side].map(id=>nm(id)+"("+(posOf(id)[0]||"?")+")").join(", ");
    try{const r=await S.sample(`Viết nhận định 80-120 từ bằng tiếng Việt, giọng bình luận viên phong trào vui vẻ, cho trận của CLB FC Nguyễn Huệ chia hai đội Xanh và Cam.\nĐội Xanh: ${desc("blue")}\nĐội Cam: ${desc("orange")}\nTỷ lệ tính từ chỉ số nội bộ: Xanh ${p.pb}%, Hòa ${p.pd}%, Cam ${p.po}%.\nKết quả các trận trước (tất cả cầu thủ): ${recent}.\nChỉ dùng dữ liệu trên, không bịa thành tích hay chuyện riêng của ai. Không nhắc đến chỉ số trình độ. Chỉ trả về đoạn văn.`,{modelTier:"quick",cache:false});
      await save("analysis/"+mid,{text:r.text.trim(),pb:p.pb,pd:p.pd,po:p.po,t:new Date().toISOString()});toast("Đã có nhận định")}catch(x){toast("Chưa tạo được nhận định")}break}
  case "pred":{const b=val("pB"),o=val("pO");if(b===""||o==="")return toast("Nhập tỷ số hai đội");if(await save("pred/"+mid+"__"+S.meId,{b:Math.max(0,Math.floor(+b)),o:Math.max(0,Math.floor(+o)),t:new Date().toISOString()}))toast("Đã chốt dự đoán");break}
  case "cmt":{const tx=val("cmt").trim();if(!tx||!S.meId)return;const id="c"+Date.now().toString(36)+uid8();const i=document.getElementById("cmt");if(i)i.value="";await save("comments/"+id,{m:mid,who:S.meId,text:tx,t:new Date().toISOString()});break}
  case "savePs":{const ids=psIds({id:mid}),g={},a={},yc={},rc={},pos={},ot=[],cs=[],pp=[],pay=[],sup=[],pl=[];const ck=(k,id)=>{const x=document.getElementById("ps"+k+"_"+id);return !!(x&&x.checked)};ids.forEach(id=>{const n=k=>Math.max(0,Math.floor(+val(k+"_"+id)||0));if(n("psg"))g[id]=n("psg");if(n("psa"))a[id]=n("psa");if(n("psy"))yc[id]=n("psy");if(n("psr"))rc[id]=n("psr");pos[id]=val("pspos_"+id)||"TĐ";if(ck("pl",id))pl.push(id);if(ck("ot",id))ot.push(id);if(ck("cs",id))cs.push(id);if(ck("pp",id))pp.push(id);if(ck("pay",id))pay.push(id);if(ck("sup",id))sup.push(id)});if(await save("pstats/"+mid,{g,a,yc,rc,pos,pl,ot,cs,pp,pay,sup,mvp:val("psm")||null,t:new Date().toISOString()}))toast("Đã lưu, app đã tính điểm");break}
  case "delc":await del("comments/"+v);break;
  case "rvote":{if(!S.meId)return;await save("rvotes/"+el.dataset.k+"__"+S.meId,{s:v,t:new Date().toISOString()});break}
  case "bill":{const key=el.dataset.k,venue=val("rVenue").trim(),total=parseMoney(val("rTotal")),payer=val("rPayer");
    const joins=Object.entries(S.rvotes).filter(([k,x])=>k.startsWith(key+"__")&&x.s==="join").map(([k])=>k.split("__")[1]);
    const went=joins.filter(id=>{const c=document.getElementById("went_"+id);return c?c.checked:true});
    for(const id of joins){const c=document.getElementById("went_"+id);if(c&&S.rvotes[key+"__"+id].went!==c.checked)await save("rvotes/"+key+"__"+id,{went:c.checked},true)}
    const data={venue};if(total&&went.length){const each=Math.round(total/went.length/1000)*1000||Math.round(total/went.length);const sh={};went.forEach(id=>sh[id]=each);data.total=total;data.shares=sh;data.payer=payer||null;data.paid=(S.rounds[key]||{}).paid||{};if(payer)data.paid[payer]=true}
    if(await save("rounds/"+key,data))toast(total?"Đã chia bill":"Đã lưu quán");break}
  case "paid":{const key=el.dataset.k,r=S.rounds[key]||{},paid=Object.assign({},r.paid||{});paid[v]=!paid[v];await save("rounds/"+key,{paid},true);break}
  case "saveTx":{const amt=parseMoney(val("txA"));if(!amt)return toast("Nhập số tiền hợp lệ");const d=fromLocal(val("txD"))||new Date().toISOString();const cat=val("txC");const mid2=val("txM")||null;const period=(cat==="Phí thành viên (tháng)")?val("txP"):null;
    const id="t"+Date.now().toString(36)+uid8();if(await save("fund/"+id,{type:v,amount:amt,cat,date:d,mid:mid2,period,note:val("txN").trim(),by:S.meId||null,created:new Date().toISOString()})){S.modal=null;toast("Đã ghi vào quỹ")}break}
  case "reverse":{const t=S.fund[v];if(!t)return;const id="t"+Date.now().toString(36)+uid8();const ok=await save("fund/"+id,{type:t.type==="in"?"out":"in",amount:t.amount,cat:t.cat,date:new Date().toISOString(),mid:t.mid||null,period:t.period||null,note:"Đảo bút toán: "+(t.note||t.cat),revOf:v,by:S.meId||null,created:new Date().toISOString()});if(ok){await save("fund/"+v,{rev:id},true);S.modal=null;toast("Đã đảo bút toán")}break}
  case "saveMember":{const name=val("mName").trim();if(!name)return toast("Nhập họ tên");const pos=POS.filter(p=>document.getElementById("mp_"+p).checked).slice(0,3);const id=v||"u"+Date.now().toString(36)+uid8();const old=S.members[id]||{};
    const ok=await save("members/"+id,{name,nick:val("mNick").trim(),no:val("mNo").trim(),phone:val("mPhone").trim(),pos,addr:val("mAddr").trim(),hlv:document.getElementById("mHlv").checked,cheer:document.getElementById("mCheer").checked,role:val("mRole").trim(),note:old.note||"",active:document.getElementById("mAct").checked,created:old.created||new Date().toISOString()});
    const rv=parseFloat(val("mRate"));if(ok){if(pos.length)await save("mypos/"+id,{pos,t:new Date().toISOString()});if(rv>0)await save("ratings/"+id,{v:Math.min(10,rv)});else if(S.ratings[id])await del("ratings/"+id);S.modal=null;toast("Đã lưu")}break}
  case "delMember":{if(await del("members/"+v)){S.modal=null;toast("Đã xóa")}break}
  case "bulkAdd":{const lines=val("bulkT").split("\n").map(s=>s.trim()).filter(Boolean);let n=0;for(const ln of lines){const p=ln.split(",").map(s=>s.trim());if(!p[0])continue;const pos=(p[3]||"").toUpperCase().split(/[\/\s]+/).filter(x=>POS.includes(x));const id="u"+Date.now().toString(36)+uid8();if(await save("members/"+id,{name:p[0],nick:"",no:p[2]||"",phone:p[1]||"",pos,addr:"",active:true,created:new Date().toISOString()}))n++}S.modal=null;toast("Đã thêm "+n+" thành viên");break}
  case "saveCfg":{const data={fee:parseMoney(val("cFee"))||0,teamSize:Number(val("cSize")),ptsExact:Number(val("cEx")),ptsResult:Number(val("cRs")),pPlay:Number(val("cPp"))||0,pOnTime:Number(val("cOt"))||0,pGoalTD:Number(val("cGd"))||0,pGoalTV:Number(val("cGv"))||0,pGoalHV:Number(val("cGh"))||0,pGoalTM:Number(val("cGm"))||0,pHat:Number(val("cHt"))||0,pAssist:Number(val("cPa"))||0,pClean:Number(val("cCs"))||0,pPen:Number(val("cPn"))||0,pYellow:Number(val("cYc"))||0,pRed:Number(val("cRc"))||0,pPay:Number(val("cPy"))||0,pSup:Number(val("cSp"))||0,minPeople:Number(val("cMin"))||6,troll:val("cTroll"),venues:val("cVen").split("\n").map(s=>s.trim()).filter(Boolean)};if(await save("cfg/club",Object.assign({},S.cfg,data)))toast("Đã lưu cấu hình");break}
  case "saveNotice":{const tx=val("ntT").trim();if(!tx)return toast("Nhập nội dung thông báo");if(await save("cfg/club",Object.assign({},S.cfg,{notice:{text:tx,by:S.meId?nm(S.meId):"Admin",t:new Date().toISOString()}})))toast("Đã đăng thông báo");break}
  case "clearNotice":{const c2=Object.assign({},S.cfg);delete c2.notice;if(await save("cfg/club",c2))toast("Đã gỡ thông báo");break}
  case "fb":{const tx=val("fbT").trim();if(!tx)return toast("Nhập góp ý trước nhé");const id="f"+Date.now().toString(36)+uid8();if(await save("feedback/"+id,{text:tx,who:S.meId||null,t:new Date().toISOString()})){const i=document.getElementById("fbT");if(i)i.value="";toast("Cảm ơn anh đã góp ý")}break}
  case "delmedia":await del("media/"+v);break;
  case "delfb":await del("feedback/"+v);break;
  }
});
document.addEventListener("change",async e=>{
  const el=e.target;if(!el.dataset||!el.dataset.a)return;const a=el.dataset.a;
  if(a==="per"){S.bxhPeriod=el.value;render()}
  else if(a==="fm"){S.fundMonth=el.value;render()}
  else if(a==="hv"){S.hv=el.value?{m:el.dataset.m,n:Number(el.value)}:null;render()}
  else if(a==="mm"){S.mediaMatch=el.value;render()}
  else if(a==="trollopt"&&S.meId){await save("prefs/"+S.meId,{troll:el.checked});toast(el.checked?"Bot được trêu nhẹ anh":"Bot sẽ không nhắc tên anh khi trêu")}
  else if(a==="upload2"&&window.__GAS){await uploadMedia(el)}
  else if(a==="upload"&&S.assets){
    if(!S.mediaMatch){el.value="";return toast("Chọn trận ở ô bên trái trước khi thêm ảnh")}
    let n=0;for(const f of [...el.files]){try{const r=await S.assets.upload(f);const id="p"+Date.now().toString(36)+uid8();if(await save("media/"+id,{m:S.mediaMatch,asset:r.id,url:r.url,t:new Date().toISOString()}))n++}catch(x){toast("Ảnh quá lớn hoặc sai định dạng")}}
    el.value="";if(n)toast("Đã thêm "+n+" ảnh");
  }
});
(function(){const f=e=>{const t=e.target,i=t&&t.id||"";if(i.indexOf("ps")!==0||i==="psm")return;const id=i.split("_")[1];if(!id)return;const o=document.getElementById("psout_"+id);if(!o)return;const g=k=>document.getElementById("ps"+k+"_"+id),n=k=>Math.max(0,Math.floor(+(g(k)&&g(k).value)||0)),ck=k=>!!(g(k)&&g(k).checked),c=C(),pos=(g("pos")&&g("pos").value)||"TĐ";const k=n("g");o.textContent=ck("pl")?c.pPlay+k*goalPt(c,pos)+(k>=3?c.pHat:0)+n("a")*c.pAssist+(ck("ot")?c.pOnTime:0)+(ck("cs")?c.pClean:0)+(ck("pp")?c.pPen:0)+n("y")*c.pYellow+n("r")*c.pRed+(ck("pay")?c.pPay:0)+(ck("sup")?c.pSup:0):0};document.addEventListener("input",f);document.addEventListener("change",f)})();
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="chatIn")sendChat();if(e.key==="Enter"&&e.target.id==="cmt"){const b=document.querySelector('[data-a="cmt"]');b&&b.click()}});

/* ---------- boot ---------- */
async function boot(){
  try{S.db=await claude.use("db");S.user=await claude.use("user");S.sample=await claude.use("sample");S.assets=await claude.use("assets");S.downloads=await claude.use("downloads")}catch(e){}
  if(!S.db){$app.innerHTML='<div style="text-align:center;padding:24vh 20px;color:#A8B2D8"><h3 style="color:#F5F7FF">Cần đăng nhập</h3><p>Anh đăng nhập claude.ai và mở lại trang này để dùng app FC Nguyễn Huệ.</p></div>';return}
  try{S.uid=S.user?await S.user.id():null;S.isAdmin=S.user?await S.user.canEdit():false;S.canWrite=S.user?await S.user.can("data.write"):null}catch(e){}
  const sub=(name,key)=>S.db.collection(name).onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});S[key]=o;render()},()=>{});
  ["members","matches","votes","pred","comments","teams","fund","rvotes","rounds","ratings","analysis","prefs","media","feedback","pstats","mypos"].forEach(n=>sub(n,n));
  S.db.doc("cfg/club").onSnapshot(d=>{S.cfg=d.exists?d.data():{};render()},()=>{});
  if(S.uid){try{const me=await S.db.doc("data/users/"+S.uid+"/me").get();if(me.exists)S.meId=me.data().m}catch(e){}}
  if(S.meId&&!S.isAdmin&&window.__memCheck){try{const ok=await window.__memCheck();if(!ok||window.__tokId()!==S.meId)S.meId=null}catch(e){}}
  S.loaded=true;render();
}
boot();
})();
